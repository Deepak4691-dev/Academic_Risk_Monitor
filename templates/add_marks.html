{% extends "base.html" %}
{% block title %}Add marks · Academic Risk Monitor{% endblock %}
{% block content %}
<h1>Add marks</h1>
<section class="panel narrow">
  <form method="post">
    <label>Student
      <select name="student_id" required>
        <option value="">Choose a student</option>
        {% for s in students %}<option value="{{ s.student_id }}" {{ 'selected' if form.get('student_id')|string == s.student_id|string }}>{{ s.student_name }}</option>{% endfor %}
      </select>
    </label>
    <label>Subject
      <select name="subject_id" required>
        <option value="">Choose a subject</option>
        {% for s in subjects %}<option value="{{ s.subject_id }}" {{ 'selected' if form.get('subject_id')|string == s.subject_id|string }}>{{ s.subject_name }} (max {{ s.max_marks|int }})</option>{% endfor %}
      </select>
    </label>
    <div class="grid2">
      <label>Exam type <input name="exam_type" required value="{{ form.get('exam_type', 'FINAL') }}"></label>
      <label>Marks obtained <input type="number" name="marks_obtained" step="0.5" min="0" required value="{{ form.get('marks_obtained', '') }}"></label>
    </div>
    <p class="note">Saving marks for a subject that already has marks for the same exam type updates them. A student with no enrolment gets one automatically.</p>
    <div class="actions">
      <button class="btn" type="submit">Save marks</button>
      <a href="{{ url_for('performance') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
